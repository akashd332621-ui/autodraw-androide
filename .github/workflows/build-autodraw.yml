name: Build AutoDraw APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/autodraw/mobile app/src/main/res/values app/src/main/res/xml
          echo  | base64 -d > "settings.gradle.kts"
          echo cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjYuMSIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMi4wLjIxIiBhcHBseSBmYWxzZQp9Cg== | base64 -d > "build.gradle.kts"
          echo b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmtvdGxpbi5jb2RlLnN0eWxlPW9mZmljaWFsCg== | base64 -d > "gradle.properties"
          mkdir -p "app"
          echo  | base64 -d > "app/build.gradle.kts"
          mkdir -p "app/src/main"
          echo  | base64 -d > "app/src/main/AndroidManifest.xml"
          mkdir -p "app/src/main/java/com/autodraw/mobile"
          echo  | base64 -d > "app/src/main/java/com/autodraw/mobile/AutoDrawAccessibilityService.kt"
          mkdir -p "app/src/main/java/com/autodraw/mobile"
          echo  | base64 -d > "app/src/main/java/com/autodraw/mobile/MainActivity.kt"
          mkdir -p "app/src/main/res/values"
          echo  | base64 -d > "app/src/main/res/values/styles.xml"
          mkdir -p "app/src/main/res/values"
          echo PHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5BdXRvRHJhdyBNb2JpbGU8L3N0cmluZz48c3RyaW5nIG5hbWU9ImFjY2Vzc2liaWxpdHlfZGVzYyI+QWxsb3dzIEF1dG9EcmF3IE1vYmlsZSB0byBkcmF3IGltYWdlIHBhdGhzIGluIG90aGVyIGFwcHMgd2hlbiB5b3Ugc3RhcnQgYSBkcmF3aW5nLjwvc3RyaW5nPjwvcmVzb3VyY2VzPgo= | base64 -d > "app/src/main/res/values/strings.xml"
          mkdir -p "app/src/main/res/values"
          echo PHJlc291cmNlcz48Y29sb3IgbmFtZT0iYmxhY2siPiMwMDAwMDA8L2NvbG9yPjxjb2xvciBuYW1lPSJ3aGl0ZSI+I0ZGRkZGRjwvY29sb3I+PC9yZXNvdXJjZXM+Cg== | base64 -d > "app/src/main/res/values/colors.xml"
          mkdir -p "app/src/main/res/xml"
          echo  | base64 -d > "app/src/main/res/xml/accessibility_service_config.xml"

      - name: Install Gradle
        shell: bash
        run: |
          set -e
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo /opt/gradle-8.10.2/bin >> $GITHUB_PATH

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoDraw-debug-apk
          path: app/build/outputs/apk/debug/*.apk
